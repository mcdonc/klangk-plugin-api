name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Check 100% line coverage
        run: |
          TOTAL=$(grep -c '^DA:' coverage/lcov.info)
          HIT=$(grep '^DA:' coverage/lcov.info | grep -cv ',0$')
          echo "Coverage: $HIT/$TOTAL lines"
          if [ "$HIT" -ne "$TOTAL" ]; then
            echo "FAIL: $((TOTAL - HIT)) lines uncovered"
            grep '^DA:' coverage/lcov.info | grep ',0$'
            exit 1
          fi
          echo "OK: 100% line coverage"
